
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm - Mũi Cà Mau</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .header {
      background: #fff;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    h1 {
      font-size: 23px;
      margin: 0 0 6px;
    }

    .sub {
      color: #64748b;
      font-size: 13px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(200px, 260px) 1fr auto;
      gap: 10px;
      margin-top: 20px;
    }

    select,
    input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #2563eb;
    }

    button {
      padding: 11px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .stat {
      background: #f1f5f9;
      padding: 10px 16px;
      border-radius: 8px;
      min-width: 125px;
      font-size: 12px;
      color: #64748b;
    }

    .stat strong {
      display: block;
      font-size: 21px;
      color: #1e293b;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
    }

    .category-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .category-tag {
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 20px;
      padding: 6px 11px;
      font-size: 12px;
    }

    .section {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-heading h2 {
      font-size: 17px;
      margin: 0;
    }

    .result-count {
      color: #64748b;
      font-size: 13px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
    }

    .product {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      transition: box-shadow .2s, transform .2s;
      min-width: 0;
    }

    .product:hover {
      box-shadow: 0 5px 16px rgba(0,0,0,.09);
      transform: translateY(-2px);
    }

    .product-image {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #fff;
      border-bottom: 1px solid #f1f5f9;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .no-image {
      color: #94a3b8;
      font-size: 13px;
    }

    .product-info {
      padding: 13px;
    }

    .product-category {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      margin-bottom: 9px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 650;
      line-height: 1.5;
      min-height: 42px;
      margin-bottom: 9px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      color: #dc2626;
      font-size: 15px;
      font-weight: 750;
      margin-bottom: 12px;
    }

    .product-link {
      display: block;
      text-align: center;
      background: #2563eb;
      color: #fff;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      text-decoration: none;
    }

    .product-link:hover {
      background: #1d4ed8;
      text-decoration: none;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 55px 15px;
      color: #64748b;
      font-size: 14px;
    }

    .loading {
      opacity: .65;
      pointer-events: none;
    }

    @media (max-width: 1000px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-image {
        height: 145px;
      }

      .product-info {
        padding: 10px;
      }

      h1 {
        font-size: 19px;
      }

      .section {
        padding: 12px;
      }
    }

    @media (max-width: 360px) {
      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="header">
      <h1>MŨI CÀ MAU - QUẢN LÝ SẢN PHẨM</h1>
      <div class="sub">
        Tra cứu sản phẩm từ các danh mục trên website Mũi Cà Mau
      </div>

      <div class="toolbar">
        <select id="categorySelect">
          <option value="all">Tất cả danh mục</option>
          <option value="laptop">Laptop</option>
          <option value="pc-may-tinh-de-ban">PC - Máy tính để bàn</option>
          <option value="camera-quan-sat">Camera quan sát</option>
          <option value="lcd-man-hinh">LCD - Màn hình</option>
          <option value="gear">Gear</option>
          <option value="linh-kien-pc">Linh kiện PC</option>
          <option value="thiet-bi-mang">Thiết bị mạng</option>
<option value="phu-kien-cac-loai">Phụ kiện các loại</option>
<option value="pm-ban-quyen">Phần mềm bản quyền</option>
        </select>

        <input
          type="search"
          id="searchInput"
          placeholder="Tìm kiếm theo tên sản phẩm..."
          autocomplete="off"
        >

        <button id="btnLoad" onclick="loadProducts()">
          Tải sản phẩm
        </button>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="totalProducts">0</strong>
          Sản phẩm
        </div>

        <div class="stat">
          <strong id="totalPages">0</strong>
          Trang đã quét
        </div>

        <div class="stat">
          <strong id="totalCategories">0</strong>
          Danh mục
        </div>
      </div>

      <div id="status" class="status">
        Sẵn sàng. Chọn danh mục và nhấn Tải sản phẩm.
      </div>

      <div id="categorySummary" class="category-summary"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Danh sách sản phẩm</h2>
        <span id="resultCount" class="result-count">
          0 kết quả
        </span>
      </div>

      <div id="productGrid" class="product-grid">
        <div class="empty">
          Chưa có dữ liệu. Hãy chọn danh mục và tải sản phẩm.
        </div>
      </div>
    </section>

  </main>

  <script>
    const API_URL = "/api/products";

    let allProducts = [];
    let isLoading = false;

    const categorySelect =
      document.getElementById("categorySelect");

    const searchInput =
      document.getElementById("searchInput");

    const btnLoad =
      document.getElementById("btnLoad");

    // Tải dữ liệu từ API.
    async function loadProducts() {
      if (isLoading) return;

      isLoading = true;
      btnLoad.disabled = true;
      btnLoad.textContent = "Đang tải...";

      const grid = document.getElementById("productGrid");
      const status = document.getElementById("status");

      const category = categorySelect.value;

      allProducts = [];

      updateStats(0, 0, 0);

      grid.innerHTML = `
        <div class="empty">
          Đang kết nối máy chủ và quét sản phẩm...
          <br><br>
          Quá trình có thể mất một lúc nếu có nhiều sản phẩm.
        </div>
      `;

      status.textContent = "Đang quét dữ liệu...";

      try {
        const response = await fetch(
          `${API_URL}?category=${encodeURIComponent(category)}`,
          {
            method: "GET",
            cache: "no-store"
          }
        );

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            result.error ||
            `Máy chủ trả về HTTP ${response.status}`
          );
        }

        if (!result.success) {
          throw new Error(result.error || "Không thể lấy dữ liệu.");
        }

        allProducts = Array.isArray(result.products)
          ? result.products
          : [];

        updateStats(
          result.totalProducts || 0,
          result.totalPages || 0,
          result.categories ? result.categories.length : 0
        );

        renderCategorySummary(result.categories || []);
        filterProducts();

        const errorCount = (result.errors || []).length;

        if (errorCount > 0) {
          status.textContent =
            `Đã tải ${allProducts.length} sản phẩm. Có ${errorCount} danh mục gặp lỗi; xem thông tin bên dưới.`;
        } else {
          status.textContent =
            `Hoàn tất! Đã tải ${allProducts.length} sản phẩm từ ${result.totalPages || 0} trang.`;
        }

      } catch (error) {
        console.error(error);

        status.textContent = "Lỗi: " + error.message;

        grid.innerHTML = `
          <div class="empty">
            ${escapeHtml(error.message)}
          </div>
        `;

      } finally {
        isLoading = false;
        btnLoad.disabled = false;
        btnLoad.textContent = "Tải sản phẩm";
      }
    }

    // Cập nhật thống kê.
    function updateStats(products, pages, categories) {
      document.getElementById("totalProducts").textContent = products;
      document.getElementById("totalPages").textContent = pages;
      document.getElementById("totalCategories").textContent = categories;
    }

    // Hiển thị thống kê từng danh mục.
    function renderCategorySummary(categories) {
      const container =
        document.getElementById("categorySummary");

      container.innerHTML = categories.map(item => `
        <span class="category-tag">
          ${escapeHtml(item.name)}: ${item.totalProducts} sản phẩm
          ${item.error ? "(Có lỗi)" : ""}
        </span>
      `).join("");
    }

    // Tìm kiếm và lọc sản phẩm.
    function filterProducts() {
      const keyword = searchInput.value
        .trim()
        .toLocaleLowerCase("vi");

      const selectedCategory = categorySelect.value;

      const filtered = allProducts.filter(product => {
        const matchesName = String(product.name || "")
          .toLocaleLowerCase("vi")
          .includes(keyword);

        const matchesCategory =
          selectedCategory === "all" ||
          product.categorySlug === selectedCategory;

        return matchesName && matchesCategory;
      });

      renderProducts(filtered);
    }

    // Hiển thị danh sách sản phẩm.
    function renderProducts(products) {
      const grid = document.getElementById("productGrid");

      document.getElementById("resultCount").textContent =
        `${products.length} kết quả`;

      if (!products.length) {
        grid.innerHTML = `
          <div class="empty">
            Không tìm thấy sản phẩm phù hợp.
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map(product => `
        <article class="product">
          <div class="product-image">
            ${
              product.image
                ? `
                  <img
                    src="${escapeAttribute(product.image)}"
                    alt="${escapeAttribute(product.name)}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                  >
                  <span class="no-image" style="display:none;">
                    Không tải được hình ảnh
                  </span>
                `
                : `<span class="no-image">Chưa có hình ảnh</span>`
            }
          </div>

          <div class="product-info">
            <span class="product-category">
              ${escapeHtml(product.category || "")}
            </span>

            <div class="product-name">
              ${escapeHtml(product.name)}
            </div>

            <div class="product-price">
              ${escapeHtml(product.price || "Liên hệ")}
            </div>

            ${
              product.link
                ? `
                  <a
                    class="product-link"
                    href="${escapeAttribute(product.link)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Xem chi tiết
                  </a>
                `
                : ""
            }
          </div>
        </article>
      `).join("");
    }

    // Chống chèn HTML không an toàn.
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    // Lọc ngay khi nhập từ khóa.
    searchInput.addEventListener("input", filterProducts);

    // Khi đổi danh mục, lọc ngay trên dữ liệu đã tải.
    // Nhấn Tải sản phẩm để quét lại riêng danh mục đó.
    categorySelect.addEventListener("change", filterProducts);

    // Tự tải tất cả danh mục khi mở trang.
    loadProducts();
  </script>
</body>
</html>
